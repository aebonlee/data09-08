<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>초도품 치수검사 판정 도구</title>
  <meta name="description" content="도면 치수 기준표와 CMM·수기 측정결과를 항목번호로 맞춰 OK / NOK / 확인필요를 판정하고 도면 위에 표시하는 브라우저용 도구(1단계 시연판)">
  <meta name="robots" content="noindex">
  <!-- 폐쇄망 보장: 외부로 요청하는 코드는 「AI 읽기」(js/ai.js) 한 곳뿐이고 폐쇄망 모드에서는 요청을 만들지도 않습니다.
       AI 주소를 설정에서 고를 수 있게 되어(2026-09-29) 연결 허용을 https 주소 전체로 넓혔습니다(암호화 안 된 http 는 막음).
       사내 웹서버에 올릴 때는 아래 connect-src 를 회사가 허용한 AI 주소 하나로 좁히십시오(예: connect-src https://llm.사내도메인).
       사내 LLM 서버가 http 뿐이면 그 주소를 여기에 더합니다(예: connect-src https: http://10.0.0.5:8000). 폐쇄망 전용이면 connect-src 'none'. -->
  <meta http-equiv="Content-Security-Policy" content="connect-src https:; object-src 'none'; base-uri 'none'">
  <link rel="stylesheet" href="css/style.css">
</head>

  <a class="skip" href="#main">본문으로 건너뛰기</a>

  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- 파일(file://)로 열어도 돌도록 module 이 아닌 일반 스크립트로 불러옵니다 -->
  <script src="vendor/xlsx.full.min.js"></script>
